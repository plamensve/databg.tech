<header class="site-header">
    <div class="container nav-container">
        <a href="{{ '/' | relative_url }}" class="logo" aria-label="DataBG home">
            <img class="logo-image" src="{{ '/assets/img/databg-logo.svg' | relative_url }}" alt="DataBG" width="160" height="40">
        </a>

        <button class="mobile-nav-toggle" type="button" aria-expanded="false" aria-controls="main-navigation" aria-label="Open navigation">
            <span></span><span></span><span></span>
        </button>

        <nav class="main-nav" id="main-navigation" aria-label="Main navigation">
            <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} is-active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span>
            </a>
            <a href="{{ '/tools.html' | relative_url }}" class="nav-link{% if page.url contains '/tools' %} is-active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg><span>Tools</span>
            </a>
            <a href="{{ '/datasets.html' | relative_url }}" class="nav-link{% if page.url == '/datasets.html' %} is-active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg><span>Datasets</span>
            </a>
            <a href="{{ '/docs.html' | relative_url }}" class="nav-link{% if page.url == '/docs.html' %} is-active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5zM5 4.5v17M8.5 6H16M8.5 10H17"/></svg><span>Docs</span>
            </a>
            <a href="{{ '/about.html' | relative_url }}" class="nav-link{% if page.url == '/about.html' %} is-active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg><span>About</span>
            </a>
            <a href="https://api.databg.tech/openapi.json" class="mobile-api-link" target="_blank" rel="noopener">API Docs <span>↗</span></a>
        </nav>

        <a href="https://api.databg.tech/openapi.json" class="nav-cta" target="_blank" rel="noopener">
            <svg class="nav-cta-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg><span>API Docs</span><span class="nav-cta-arrow">↗</span>
        </a>
    </div>
</header>
